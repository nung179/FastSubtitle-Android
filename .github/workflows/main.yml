name: Build Fast Subtitle APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FastSubtitle

    steps:
      - name: Ambil source
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: FastSubtitle-APK
          path: FastSubtitle/app/build/outputs/apk/debug/app-debug.apk
